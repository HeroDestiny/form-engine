limit_req_zone $binary_remote_addr zone=readiness:1m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 2M;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"data":null,"message":"O corpo da requisição excede o limite de 2 MiB.","errors":null}';
    }
    location = /ready {
        limit_req zone=readiness burst=10 nodelay;
        include fastcgi_params;
        # Identify this trusted hop; the host TLS proxy supplies the actual client in X-Forwarded-For.
        fastcgi_param REMOTE_ADDR ${NGINX_PROXY_ADDRESS};
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 10s;
    }
    location ~ ^/(api(?:/|$)|up$) {
        include fastcgi_params;
        fastcgi_param REMOTE_ADDR ${NGINX_PROXY_ADDRESS};
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 180s;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
