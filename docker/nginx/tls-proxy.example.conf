# Host-level reverse proxy example. Replace domain and certificate paths.
server {
    listen 80;
    server_name forms.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name forms.example.com;
    ssl_certificate /etc/letsencrypt/live/forms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"data":null,"message":"O corpo da requisição excede o limite de 2 MiB.","errors":null}';
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
