name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: SQLite
            phpunit: phpunit.xml
          - database: PostgreSQL
            phpunit: phpunit.postgres.xml
    services:
      postgres-test:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: form_engine_testing
          POSTGRES_USER: form_engine_testing
          POSTGRES_PASSWORD: testing_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U form_engine_testing -d form_engine_testing"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_PG_HOST: 127.0.0.1

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run backend tests
        run: php vendor/bin/phpunit --configuration=${{ matrix.phpunit }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
